location ^~ /work/ {
    proxy_pass http://127.0.0.1:4342;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 8k;
    proxy_read_timeout 15s;
}
location ^~ /r/ {
    proxy_pass http://127.0.0.1:4342;
    proxy_set_header Host $host;
